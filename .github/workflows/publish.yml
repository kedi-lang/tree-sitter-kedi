name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build And Publish Workspace
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate Release
        run: |
          uv sync --all-extras
          npm ci
          npm test

      - name: Build And Publish Root Project
        shell: bash
        run: |
          rm -rf dist
          uv build --sdist
          uv publish dist/*
