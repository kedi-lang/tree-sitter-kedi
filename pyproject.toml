[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-kedi"
version = "0.4.0"
description = "Kedi grammar for tree-sitter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net" },
  { name = "Mert Sırakaya",        email = "mert@kedi-lang.org" },
]
dependencies = ["tree-sitter>=0.25"]
keywords = ["kedi", "tree-sitter", "parser", "dsl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/kedi-lang/tree-sitter-kedi"
Repository = "https://github.com/kedi-lang/tree-sitter-kedi"
Issues = "https://github.com/kedi-lang/tree-sitter-kedi/issues"

[tool.setuptools]
# The package is laid out under bindings/python/ so that the same
# directory tree also hosts node, swift, etc. bindings for editors that
# expect them. `package-dir` re-roots Python at bindings/python/.
include-package-data = true

[tool.setuptools.packages.find]
where = ["bindings/python"]
include = ["tree_sitter_kedi*"]

[tool.setuptools.package-dir]
"" = "bindings/python"

[tool.setuptools.package-data]
"tree_sitter_kedi" = ["*.pyi", "py.typed", "queries/*.scm"]
