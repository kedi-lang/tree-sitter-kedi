[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-kedi"
version = "0.4.9"
description = "Kedi grammar for tree-sitter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# PyPI shows the Author field in full but only the first address of Author-email, so names and
# addresses are separate entries.
authors = [
    {name = "Doğukan Yiğit Polat"},
    {name = "Mert Sırakaya"},
    {email = "yigit@neurograph.net"},
    {email = "mert@kedi-lang.org"},
]
dependencies = ["tree-sitter==0.26.0"]
keywords = ["kedi", "tree-sitter", "parser", "dsl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/kedi-lang/tree-sitter-kedi"
Repository = "https://github.com/kedi-lang/tree-sitter-kedi"
Issues = "https://github.com/kedi-lang/tree-sitter-kedi/issues"

[tool.setuptools]
# The package is laid out under bindings/python/ so that the same
# directory tree also hosts node, swift, etc. bindings for editors that
# expect them. `package-dir` re-roots Python at bindings/python/.
include-package-data = true

[tool.setuptools.packages.find]
where = ["bindings/python"]
include = ["tree_sitter_kedi*"]

[tool.setuptools.package-dir]
"" = "bindings/python"

[tool.setuptools.package-data]
"tree_sitter_kedi" = ["*.pyi", "py.typed", "queries/*.scm"]
